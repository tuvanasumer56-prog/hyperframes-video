<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Dilimizdeki Duvarlar — SİYAMDER Ankara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --petrol:#6A909B; --petrol-koyu:#4E6B75; --sari:#EDB43A; --sari-acik:#F2C760;
    --zemin:#F4F3EF; --petrol-acik:#B4C3C7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;background:var(--zemin);overflow:hidden}
  .poster{position:relative;width:1080px;height:1350px;background:var(--zemin);font-family:'Montserrat',sans-serif;color:var(--petrol-koyu)}
  .layer{position:absolute;inset:0}
  .logo{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:400px}
  .etiket{position:absolute;top:240px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;
    font-weight:600;font-size:25px;letter-spacing:.32em;color:var(--petrol)}
  .etiket i{display:block;width:70px;height:2px;background:var(--sari)}
  .baslik{position:absolute;top:298px;left:0;width:1080px}
  .alt{position:absolute;top:586px;left:50%;transform:translateX(-50%);background:var(--sari);color:var(--petrol-koyu);
    font-weight:700;font-size:28px;letter-spacing:.06em;padding:13px 34px;border-radius:40px;white-space:nowrap}
  .konuk{position:absolute;top:668px;left:50%;transform:translateX(-50%);width:370px;height:370px}
  .pill{position:absolute;top:1000px;left:50%;transform:translateX(-50%);background:var(--petrol);color:#fff;text-align:center;
    border-radius:26px;padding:14px 44px 16px;font-family:'Nunito',sans-serif;box-shadow:0 6px 18px rgba(78,107,117,.18)}
  .pill b{display:block;font-size:31px;font-weight:800;letter-spacing:.01em}
  .pill span{display:block;font-size:23px;font-weight:700;opacity:.95}
  .bilgi{position:absolute;top:1112px;left:0;right:0;text-align:center;font-family:'Nunito',sans-serif;font-weight:800;color:var(--petrol-koyu)}
  .bilgi .t{font-size:40px}
  .bilgi .t em{font-style:normal;color:var(--sari);padding:0 6px}
  .bilgi .p{font-size:36px;margin-top:2px}
  .erisim{position:absolute;top:1238px;left:0;right:0;display:flex;justify-content:center;gap:26px;font-family:'Nunito',sans-serif;
    font-weight:700;font-size:19px;color:var(--petrol)}
  .erisim span{display:flex;align-items:center;gap:8px}
  .footer{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;
    font-family:'Nunito',sans-serif;font-weight:700;font-size:20px;color:var(--petrol)}
  .footer svg{height:20px;width:auto}

  .etiket{top:222px;font-size:22px}
  .baslik2{position:absolute;top:282px;left:0;right:0;text-align:center}
  .baslik2 .y{font-weight:800;font-size:58px;color:var(--sari);letter-spacing:.01em;transform:translateX(-20px);line-height:1.1}
  .baslik2 .p{font-weight:700;font-size:32px;color:var(--petrol-koyu);letter-spacing:.02em;transform:translateX(30px);margin-top:4px}
  .cember{position:absolute;left:0;top:0}
  .pill{top:996px;padding:16px 52px 18px}
  .pill b{font-size:36px}
  .bilgi{top:1124px}
  .erisim{top:1276px}

  .logo{top:60px}
  .etiket{top:204px}
  .baslik2{top:254px}
  .pill{top:1012px;padding:14px 48px 16px;white-space:nowrap}
  .pill b{font-size:34px;letter-spacing:.02em}
  .pill span{font-size:25px;margin-top:2px}
  .alanlar{position:absolute;top:1136px;left:0;right:0;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:23px;color:var(--petrol)}
  .alanlar i{font-style:normal;color:var(--sari);padding:0 12px}
  .bilgi{top:1186px}
  .bilgi .t{font-size:40px}
  .erisim{top:1272px}
</style>
</head>
<body>
<div class="poster">
  <svg class="layer" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs>
      <filter id="doku"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
        <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .28  0 0 0 .06 0"/></filter>
      <filter id="golge" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4E6B75" flood-opacity=".18"/></filter>
      <clipPath id="foto"><path d="M290 1050 V674 A250 250 0 0 1 790 674 V1050 Z"/></clipPath>
    </defs>
    <rect width="1080" height="1350" filter="url(#doku)"/>
    <g fill="none" stroke-width="2">
      <path d="M-40 200 C 220 140, 260 420, 60 520 S -40 860, 180 980 S 120 1240, -40 1300" stroke="#E9DCB4"/>
      <path d="M-60 150 C 260 90, 300 460, 90 560 S 10 900, 230 1020" stroke="#DCE3E4"/>
      <path d="M1120 120 C 860 180, 880 420, 1020 520 S 1160 820, 930 1000 S 980 1260, 1120 1320" stroke="#E9DCB4"/>
      <path d="M1140 60 C 820 160, 860 470, 1000 600 S 1100 900, 900 1100" stroke="#DCE3E4"/>
    </g>
    <!-- sol: onay işaretli ilerleme çizgisi, çembere bağlanır -->
    <g transform="translate(80 844)">
      <line x1="0" y1="0" x2="210" y2="0" stroke="var(--sari)" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="17" fill="var(--sari)"/>
      <path d="M-8 0 l6 6 10 -12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="110" cy="0" r="14" fill="var(--zemin)" stroke="var(--sari)" stroke-width="3.5"/>
    </g>
    <!-- noktalı yay (kemer çerçeveyi izler) -->
    <g fill="var(--petrol)"><circle cx="262.0" cy="818.0" r="9.0"/><circle cx="262.0" cy="782.0" r="8.8"/><circle cx="262.0" cy="746.0" r="8.7"/><circle cx="262.0" cy="710.0" r="8.5"/><circle cx="262.0" cy="674.0" r="8.4"/><circle cx="264.4" cy="637.7" r="8.2"/><circle cx="271.5" cy="602.0" r="8.0"/><circle cx="283.2" cy="567.6" r="7.9"/><circle cx="299.2" cy="535.0" r="7.7"/><circle cx="319.4" cy="504.8" r="7.5"/><circle cx="343.4" cy="477.4" r="7.4"/><circle cx="370.8" cy="453.4" r="7.2"/><circle cx="401.0" cy="433.2" r="7.1"/><circle cx="433.6" cy="417.2" r="6.9"/><circle cx="468.0" cy="405.5" r="6.7"/><circle cx="503.7" cy="398.4" r="6.6"/><circle cx="540.0" cy="396.0" r="6.4"/><circle cx="576.3" cy="398.4" r="6.2"/><circle cx="612.0" cy="405.5" r="6.1"/><circle cx="646.4" cy="417.2" r="5.9"/><circle cx="679.0" cy="433.2" r="5.8"/><circle cx="709.2" cy="453.4" r="5.6"/><circle cx="736.6" cy="477.4" r="5.4"/><circle cx="760.6" cy="504.8" r="5.3"/><circle cx="780.8" cy="535.0" r="5.1"/><circle cx="796.8" cy="567.6" r="4.9"/><circle cx="808.5" cy="602.0" r="4.8"/><circle cx="815.6" cy="637.7" r="4.6"/><circle cx="818.0" cy="674.0" r="4.5"/><circle cx="818.0" cy="710.0" r="4.3"/><circle cx="818.0" cy="746.0" r="4.1"/><circle cx="818.0" cy="782.0" r="4.0"/><circle cx="818.0" cy="818.0" r="3.8"/><circle cx="818.0" cy="854.0" r="3.6"/><circle cx="818.0" cy="890.0" r="3.5"/><circle cx="818.0" cy="926.0" r="3.3"/><circle cx="818.0" cy="962.0" r="3.2"/><circle cx="818.0" cy="998.0" r="3.0"/></g>
    <!-- kemer fotoğraf çerçevesi -->
    <path d="M290 1050 V674 A250 250 0 0 1 790 674 V1050 Z" fill="#fff" filter="url(#golge)"/>
    <image href="konuk-pelin-genis.jpg" x="290" y="424" width="500" height="626" clip-path="url(#foto)" preserveAspectRatio="xMidYMin slice"/>
    <path d="M290 1050 V674 A250 250 0 0 1 790 674 V1050 Z" fill="none" stroke="#fff" stroke-width="8"/>
    <!-- sağ: kâğıt uçak + kesik rota -->
    <path d="M955 560 C 990 530, 1010 560, 1040 530 S 1070 480, 1100 490" fill="none" stroke="var(--petrol)" stroke-width="3" stroke-dasharray="10 11" stroke-linecap="round"/>
    <g transform="translate(850 600) rotate(-30)" fill="none" stroke="var(--petrol-koyu)" stroke-width="3.5" stroke-linejoin="round">
      <path d="M0 0 L118 -30 L44 26 Z" fill="#FBFAF7"/><path d="M44 26 L50 52 L65 12"/><path d="M118 -30 L44 26"/>
    </g>
    <!-- pırıltılar -->
    <path d="M915 930 l7 22 22 7 -22 7 -7 22 -7 -22 -22 -7 22 -7z" fill="var(--sari)"/>
    <path d="M960 1000 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" fill="var(--petrol)"/>
    <!-- detay: duvar tuğlaları dağılıyor -->
    <g fill="none" stroke="var(--petrol)" stroke-width="3" stroke-linejoin="round"><rect x="60" y="1062" width="52" height="22" rx="3"/><rect x="116" y="1062" width="52" height="22" rx="3"/><rect x="172" y="1062" width="52" height="22" rx="3"/><rect x="88" y="1036" width="52" height="22" rx="3"/><rect x="144" y="1036" width="52" height="22" rx="3"/><rect x="60" y="1010" width="52" height="22" rx="3"/></g>
    <g fill="var(--sari)" stroke="none"><rect x="190" y="996" width="52" height="22" rx="3" transform="rotate(-14 216 1007)" opacity="0.85"/><rect x="208" y="948" width="52" height="22" rx="3" transform="rotate(-26 234 959)" opacity="0.6"/><rect x="224" y="902" width="52" height="22" rx="3" transform="rotate(-38 250 913)" opacity="0.35"/></g>
    <!-- detay: konuşma balonları -->
    <g transform="translate(866 720)">
      <path d="M0 18 a18 18 0 0 1 18 -18 h92 a18 18 0 0 1 18 18 v38 a18 18 0 0 1 -18 18 h-62 l-22 20 v-20 h-8 a18 18 0 0 1 -18 -18 z" fill="#FBFAF7" stroke="var(--petrol)" stroke-width="3"/>
      <circle cx="40" cy="37" r="6" fill="var(--petrol)"/><circle cx="64" cy="37" r="6" fill="var(--petrol)"/><circle cx="88" cy="37" r="6" fill="var(--petrol)"/>
      <path d="M70 92 a14 14 0 0 1 14 -14 h56 a14 14 0 0 1 14 14 v26 a14 14 0 0 1 -14 14 h-4 v16 l-18 -16 h-34 a14 14 0 0 1 -14 -14 z" fill="var(--sari)"/>
      <text x="112" y="130" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="46" fill="#fff">“”</text>
    </g>
    <!-- detay: rozet -->
    <g transform="translate(170 548) rotate(-12)">
      <circle r="66" fill="var(--sari)"/>
      <circle r="57" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/>
      <text y="-4" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="17" fill="var(--petrol-koyu)" letter-spacing="1">İNTERAKTİF</text>
      <text y="18" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="17" fill="var(--petrol-koyu)" letter-spacing="1">SOHBET</text>
    </g>
    <!-- detay: nokta matrisi -->
    <g fill="var(--petrol-acik)"><circle cx="960" cy="1150" r="4.5"/><circle cx="960" cy="1172" r="4.5"/><circle cx="960" cy="1194" r="4.5"/><circle cx="982" cy="1150" r="4.5"/><circle cx="982" cy="1172" r="4.5"/><circle cx="982" cy="1194" r="4.5"/><circle cx="1004" cy="1150" r="4.5"/><circle cx="1004" cy="1172" r="4.5"/><circle cx="1004" cy="1194" r="4.5"/><circle cx="1026" cy="1150" r="4.5"/><circle cx="1026" cy="1172" r="4.5"/><circle cx="1026" cy="1194" r="4.5"/></g>
  </svg>

  <img class="logo" src="siyamder-ankara-logo.png" alt="SİYAMDER Ankara Yerel Kurulu">
  <div class="etiket"><i></i>3 ARALIK DÜNYA ENGELLİLER GÜNÜ<i></i></div>
  <div class="baslik2">
    <div class="y">DİLİMİZDEKİ DUVARLAR</div>
    <div class="p">SAĞLAMCILIK VE HAK TEMELLİ İLETİŞİM</div>
  </div>

  <div class="pill"><b>PELİN PEKGÖZ SAY</b><span>Sosyal Hizmet Uzmanı</span></div>
  <div class="alanlar">Hak Temelli Yaklaşım<i>•</i>Engellilik Hakları<i>•</i>Toplumsal Eşitlik</div>

  <div class="bilgi">
    <div class="t">4 Aralık Cuma<em>|</em>20.00<em>|</em>Google Meet</div>
  </div>

  <div class="erisim">
    <span><svg width="30" height="20" viewBox="0 0 30 20"><rect x="1" y="1" width="28" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="15" y="14.5" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="11" fill="currentColor">CC</text></svg>Altyazı</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Sesli betimleme</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4" r="2" fill="currentColor"/><path d="M5 8l7 1.5L19 8M12 9.5V15l-3 6M12 15l3 6"/></svg>Erişilebilir buluşma</span>
  </div>


</div>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Görünmez Engeller — SİYAMDER Ankara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --petrol:#6A909B; --petrol-koyu:#4E6B75; --sari:#EDB43A; --sari-acik:#F2C760;
    --zemin:#F4F3EF; --petrol-acik:#B4C3C7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;background:var(--zemin);overflow:hidden}
  .poster{position:relative;width:1080px;height:1350px;background:var(--zemin);font-family:'Montserrat',sans-serif;color:var(--petrol-koyu)}
  .layer{position:absolute;inset:0}
  .logo{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:400px}
  .etiket{position:absolute;top:240px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;
    font-weight:600;font-size:25px;letter-spacing:.32em;color:var(--petrol)}
  .etiket i{display:block;width:70px;height:2px;background:var(--sari)}
  .baslik{position:absolute;top:298px;left:0;width:1080px}
  .alt{position:absolute;top:586px;left:50%;transform:translateX(-50%);background:var(--sari);color:var(--petrol-koyu);
    font-weight:700;font-size:28px;letter-spacing:.06em;padding:13px 34px;border-radius:40px;white-space:nowrap}
  .konuk{position:absolute;top:668px;left:50%;transform:translateX(-50%);width:370px;height:370px}
  .pill{position:absolute;top:1000px;left:50%;transform:translateX(-50%);background:var(--petrol);color:#fff;text-align:center;
    border-radius:26px;padding:14px 44px 16px;font-family:'Nunito',sans-serif;box-shadow:0 6px 18px rgba(78,107,117,.18)}
  .pill b{display:block;font-size:31px;font-weight:800;letter-spacing:.01em}
  .pill span{display:block;font-size:23px;font-weight:700;opacity:.95}
  .bilgi{position:absolute;top:1112px;left:0;right:0;text-align:center;font-family:'Nunito',sans-serif;font-weight:800;color:var(--petrol-koyu)}
  .bilgi .t{font-size:40px}
  .bilgi .t em{font-style:normal;color:var(--sari);padding:0 6px}
  .bilgi .p{font-size:36px;margin-top:2px}
  .erisim{position:absolute;top:1238px;left:0;right:0;display:flex;justify-content:center;gap:26px;font-family:'Nunito',sans-serif;
    font-weight:700;font-size:19px;color:var(--petrol)}
  .erisim span{display:flex;align-items:center;gap:8px}
  .footer{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;
    font-family:'Nunito',sans-serif;font-weight:700;font-size:20px;color:var(--petrol)}
  .footer svg{height:20px;width:auto}
</style>
</head>
<body>
<div class="poster">

  <!-- zemin: kâğıt dokusu + ince kıvrımlı çizgiler -->
  <svg class="layer" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs>
      <filter id="doku"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
        <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .28  0 0 0 .07 0"/></filter>
    </defs>
    <rect width="1080" height="1350" filter="url(#doku)"/>
    <g fill="none" stroke-width="2">
      <path d="M-40 380 C 160 300, 120 520, 0 600 S -60 900, 90 1000" stroke="#E7D7A8" opacity=".8"/>
      <path d="M-60 330 C 200 250, 170 560, 30 650 S -10 960, 150 1080" stroke="#D9E1E2"/>
      <path d="M1120 260 C 900 330, 1010 520, 1080 600 S 1150 860, 960 1010 S 1000 1240, 1120 1300" stroke="#E7D7A8" opacity=".8"/>
      <path d="M1140 200 C 860 300, 960 560, 1050 650 S 1110 900, 930 1060" stroke="#D9E1E2"/>
    </g>
    <!-- sarı ve petrol pırıltılar -->
    <g>
      <path d="M150 760 l9 29 29 9 -29 9 -9 29 -9 -29 -29 -9 29 -9z" fill="var(--sari)"/>
      <path d="M205 845 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5z" fill="var(--petrol)"/>
      <path d="M915 905 l8 24 24 8 -24 8 -8 24 -8 -24 -24 -8 24 -8z" fill="var(--petrol)"/>
      <path d="M960 990 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="var(--sari)"/>
    </g>
    <!-- kâğıt uçak + kesik rota (marka motifi) -->
    <path d="M820 720 C 880 690, 930 720, 950 660 S 1010 560, 1090 600" fill="none" stroke="var(--petrol)" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
    <g transform="translate(760 742) rotate(-24)" fill="none" stroke="var(--petrol-koyu)" stroke-width="3.5" stroke-linejoin="round">
      <path d="M0 0 L120 -32 L44 26 Z" fill="#FBFAF7"/>
      <path d="M44 26 L50 54 L66 12"/>
      <path d="M120 -32 L44 26"/>
    </g>
    <!-- sol: noktalı ilerleme çizgisi -->
    <g transform="translate(90 1010)">
      <line x1="0" y1="0" x2="120" y2="0" stroke="var(--sari)" stroke-width="3"/>
      <circle cx="0" cy="0" r="15" fill="var(--sari)"/>
      <path d="M-7 0 l5 5 9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="120" cy="0" r="13" fill="#FBFAF7" stroke="var(--sari)" stroke-width="3"/>
    </g>
  </svg>

  <img class="logo" src="siyamder-ankara-logo.png" alt="SİYAMDER Ankara Yerel Kurulu">

  <div class="etiket"><i></i>3 ARALIK DÜNYA ENGELLİLER GÜNÜ<i></i></div>

  <!-- başlık: "GÖRÜNMEZ" kesik çizgiyle (görünmeyeni görünür kılmak), "ENGELLER" dolu -->
  <svg class="baslik" viewBox="0 0 1080 280" aria-label="Görünmez Engeller">
    <text x="540" y="122" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="128" letter-spacing="2"
      fill="none" stroke="var(--petrol)" stroke-width="7" stroke-dasharray="11 8" stroke-linejoin="round">GÖRÜNMEZ</text>
    <!-- iç konturları gizle: aynı metni zemin rengiyle üstten doldur -->
    <text x="540" y="122" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="128" letter-spacing="2"
      fill="var(--zemin)">GÖRÜNMEZ</text>
    <text x="540" y="262" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="128" letter-spacing="2"
      fill="var(--petrol-koyu)">ENGELLER</text>
  </svg>

  <div class="alt">SAĞLAMCILIK ÜZERİNE BİR SOHBET</div>

  <!-- konuk alanı: kim olduğu henüz belli değil -->
  <svg class="konuk" viewBox="0 0 400 400" aria-label="Konuk yakında açıklanacak">
    <defs><clipPath id="daire"><circle cx="200" cy="200" r="158"/></clipPath></defs>
    <g fill="var(--petrol)">
      <!-- noktalı halka, alt kısmı açık -->
      <circle cx="200" cy="20" r="7"/><circle cx="244" cy="25" r="7"/><circle cx="285" cy="40" r="7"/><circle cx="320" cy="65" r="7"/>
      <circle cx="348" cy="98" r="6.5"/><circle cx="367" cy="136" r="6"/><circle cx="378" cy="178" r="5.5"/><circle cx="378" cy="222" r="5"/>
      <circle cx="367" cy="264" r="4.5"/><circle cx="350" cy="302" r="4"/><circle cx="326" cy="334" r="3.5"/>
      <circle cx="156" cy="25" r="7"/><circle cx="115" cy="40" r="7"/><circle cx="80" cy="65" r="7"/>
      <circle cx="52" cy="98" r="6.5"/><circle cx="33" cy="136" r="6"/><circle cx="22" cy="178" r="5.5"/><circle cx="22" cy="222" r="5"/>
      <circle cx="33" cy="264" r="4.5"/><circle cx="50" cy="302" r="4"/><circle cx="74" cy="334" r="3.5"/>
    </g>
    <circle cx="200" cy="200" r="158" fill="#FFFFFF"/>
    <g clip-path="url(#daire)">
      <circle cx="200" cy="200" r="158" fill="#E9EFF0"/>
      <!-- kesik çizgili siluet -->
      <circle cx="200" cy="165" r="60" fill="#F7F9F9" stroke="var(--petrol)" stroke-width="4" stroke-dasharray="12 9"/>
      <path d="M78 372 C 86 278, 140 244, 200 244 S 314 278, 322 372" fill="#F7F9F9" stroke="var(--petrol)" stroke-width="4" stroke-dasharray="12 9"/>
      <text x="200" y="190" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="74" fill="var(--sari)">?</text>
    </g>
    <circle cx="200" cy="200" r="158" fill="none" stroke="#fff" stroke-width="6"/>
  </svg>

  <div class="pill"><b>Konuğumuz</b><span>çok yakında açıklanacak</span></div>

  <div class="bilgi">
    <div class="t">3 Aralık Perşembe<em>|</em>20.00</div>
    <div class="p">Zoom</div>
  </div>

  <div class="erisim">
    <span><svg width="30" height="20" viewBox="0 0 30 20"><rect x="1" y="1" width="28" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="15" y="14.5" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="11" fill="currentColor">CC</text></svg>Altyazı</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Sesli betimleme</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4" r="2" fill="currentColor"/><path d="M5 8l7 1.5L19 8M12 9.5V15l-3 6M12 15l3 6"/></svg>Erişilebilir buluşma</span>
  </div>

  <div class="footer">
    <span>www.siyamder.org.tr</span>
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 11v2.4h3.9c-.2 1-1.3 3-3.9 3-2.4 0-4.3-2-4.3-4.4S9.6 7.6 12 7.6c1.3 0 2.3.6 2.8 1l1.9-1.8C15.5 5.7 13.9 5 12 5a7 7 0 1 0 0 14c4 0 6.7-2.8 6.7-6.8l-.1-1.2z"/></svg>
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M14 8V6.5c0-.7.2-1 1.1-1H17V2h-2.8C11.6 2 10.6 3.5 10.6 6v2H8.5v3.4h2.1V22H14V11.4h2.6l.4-3.4z"/></svg>
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.5z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M16.5 11.5c-.3-3-2-4.5-4.5-4.5-2.8 0-4.5 2.2-4.5 5s1.7 5 4.5 5c2.4 0 3.8-1.3 3.8-3s-1.4-2.6-3.2-2.6c-1.6 0-2.6.9-2.6 2 0 1 .8 1.7 2 1.7 2.6 0 3.6-2.8 2.6-5.5"/><path d="M19.5 9C18.4 4.9 15.6 3 12 3 7 3 4 6.6 4 12s3 9 8 9c3.4 0 6-1.7 7-4.6"/></svg>
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h3.6v11H4zM5.8 3.5a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2M9.8 9h3.4v1.5c.5-.9 1.7-1.8 3.5-1.8 3.7 0 4.3 2.4 4.3 5.5V20h-3.6v-5.2c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8V20H9.8z"/></svg>
    <svg viewBox="0 0 30 22"><rect width="30" height="22" rx="6" fill="currentColor"/><path d="M12 6.5v9l8-4.5z" fill="var(--zemin)"/></svg>
    <span>/siyamder</span>
  </div>

</div>
</body>
</html>
